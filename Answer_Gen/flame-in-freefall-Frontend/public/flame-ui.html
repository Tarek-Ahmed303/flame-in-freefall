<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(32px, 4.4vw, 52px); line-height: 1.08; letter-spacing: -0.025em; max-width: 760px">What changes when fire floats</h2>
<p style="margin: 0; color: #A9B2C3; font-size: 18px; max-width: 620px">Four behaviors every spacecraft designer and crew member should understand.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); gap: 20px">
<div class="card" style="background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015)); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 30px; display: flex; flex-direction: column; gap: 16px">
<span style="width: 52px; height: 52px; border-radius: 14px; background: rgba(77, 163, 255, 0.14); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7DB8FF" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg></span>
<h3 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Spheres, not teardrops</h3>
<p style="margin: 0; color: #A9B2C3; font-size: 15px">No buoyancy means hot gas doesn't rise. Oxygen arrives only by slow diffusion, so flames round out into spheres.</p>
</div>
<div class="card" style="background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015)); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 30px; display: flex; flex-direction: column; gap: 16px">
<span style="width: 52px; height: 52px; border-radius: 14px; background: rgba(160, 130, 255, 0.14); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B9A5FF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
<h3 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Dimmer and bluer</h3>
<p style="margin: 0; color: #A9B2C3; font-size: 15px">Less glowing soot means many flames burn a faint blue — harder for crews and cameras to spot.</p>
</div>
<div class="card" style="background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015)); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 30px; display: flex; flex-direction: column; gap: 16px">
<span style="width: 52px; height: 52px; border-radius: 14px; background: rgba(61, 220, 151, 0.12); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5FE3AA" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3"></path><path d="M3 12h16a3 3 0 1 1-3 3"></path><path d="M3 16h7"></path></svg></span>
<h3 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Airflow decides</h3>
<p style="margin: 0; color: #A9B2C3; font-size: 15px">In still air a flame can starve itself. A gentle breeze — like cabin ventilation — keeps it alive and spreading.</p>
</div>
<div class="card" style="background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.015)); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 30px; display: flex; flex-direction: column; gap: 16px">
<span style="width: 52px; height: 52px; border-radius: 14px; background: rgba(255, 106, 40, 0.14); display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FF8A4C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-9z"></path></svg></span>
<h3 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 600">Invisible cool flames</h3>
<p style="margin: 0; color: #A9B2C3; font-size: 15px">On the ISS, FLEX saw heptane droplets keep reacting at low temperature after the visible flame went out.</p>
</div>

<p style="margin: 0; color: #A9B2C3; font-size: 18px; text-wrap: pretty">Decades of results live in papers, technical reports and raw datasets. Flame in Freefall connects them into one place you can search, compare and act on.</p>

</div>
<div class="card" style="display: flex; gap: 20px; align-items: flex-start; padding: 24px; border-radius: 20px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08)">

<div class="card" style="display: flex; gap: 20px; align-items: flex-start; padding: 24px; border-radius: 20px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08)">
<span style="width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #5FE3AA, #22A971); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; color: #04140C; flex: none">3</span>

<section style="position: relative; max-width: 1200px; margin: 0 auto; padding: 40px 24px 90px">

<div style="display: flex; flex-direction: column; gap: 14px; max-width: 720px">
<div style="font-size: 14px; font-weight: 600; color: #7DB8FF; letter-spacing: 0.06em">WHY NOW</div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(30px, 4vw, 46px); line-height: 1.1; letter-spacing: -0.02em">Artemis brings new air, new gravity, new fire risk.</h2>
<p style="margin: 0; color: #A9B2C3; font-size: 17px">NASA's proposed exploration atmosphere lowers pressure and raises oxygen to shorten spacewalk prep. Both make materials burn more readily.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr)); gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1)">
<div class="grad" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 60px; line-height: 1">34%</div>
<div style="color: #A9B2C3; font-size: 15px">Oxygen in the exploration atmosphere, vs. 21% on the ISS</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1)">
<div class="grad" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 60px; line-height: 1">8.2 psia</div>
<div style="color: #A9B2C3; font-size: 15px">Cabin pressure (56.5 kPa), vs. 14.7 psia at sea level</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1)">
<div class="grad" style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 60px; line-height: 1">0.16 g</div>
<div style="color: #A9B2C3; font-size: 15px">Lunar gravity — weak buoyancy can make some materials more flammable than in 1 g</div>
</div>
</div>
</div>
</section>
